[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayna"
dynamic = ["version"]
description = "Know whether your inferred neural dynamics are real, before you interpret them. Diagnoses underfitting, feature invention and dynamical misattribution in data-driven dynamics models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aslan Satary Dizaji" }]
keywords = ["neuroscience", "neural-dynamics", "lfads", "dynamical-systems", "model-validation", "computation-through-dynamics", "latent-variable-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
provenance = ["daftar>=1.0"]
dev = ["pytest>=8", "matplotlib>=3.7"]
all = ["matplotlib>=3.7", "daftar>=1.0"]

[project.scripts]
ayna = "ayna.cli:main"

[project.urls]
Homepage = "https://github.com/aslansd/ayna"
Repository = "https://github.com/aslansd/ayna"
Issues = "https://github.com/aslansd/ayna/issues"

[tool.setuptools.dynamic]
version = { attr = "ayna.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
